name: Build and publish firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install 'platformio==6.1.18'

      - name: Build application
        run: pio run -e spotpear-esp32s3-max35

      - name: Verify firmware artifact
        run: |
          test -s .pio/build/spotpear-esp32s3-max35/firmware.bin
          sha256sum .pio/build/spotpear-esp32s3-max35/firmware.bin

      - name: Replace latest OTA release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            .pio/build/spotpear-esp32s3-max35/firmware.bin#firmware.bin \
            --title "Latest ESP32 firmware" \
            --notes "Automated firmware build from commit $GITHUB_SHA" \
            --latest

      - name: Publish direct OTA artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          cp .pio/build/spotpear-esp32s3-max35/firmware.bin "$publish_dir/firmware.bin"
          cd "$publish_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ota
          git add firmware.bin
          git commit -m "Publish firmware from $GITHUB_SHA"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ota
