name: Deploy UI preview

on:
  push:
    branches:
      - main
      - fix/stats-rotation-and-preview
    paths:
      - 'preview/**'
      - '.github/workflows/ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
